name: ros2-snapd
base: core26
version: git
summary: A ROS 2 node to start and stop snap services.
description: |
  This snap contains a ROS 2 Lyrical node that exposes ROS 2 services
  which allow to interact with snap services.

  To list available snap service:
  ros2 service call /ros2_snapd/list ros_snapd_interfaces/srv/SnapdList

  To start, stop and restart snap service:
  ros2 service call /ros2_snapd/start ros_snapd_interfaces/srv/SnapdStart "service: 'service.name'"
  ros2 service call /ros2_snapd/stop ros_snapd_interfaces/srv/SnapdStop "service: 'service.name'"
  ros2 service call /ros2_snapd/restart ros_snapd_interfaces/srv/SnapdRestart "service: 'service.name'"

website: https://github.com/canonical/ros_snapd
source-code: https://github.com/canonical/ros_snapd
issues: https://github.com/canonical/ros_snapd/issues
contact: ubuntu-robotics-community@canonical.com

license: GPL-3.0

grade: stable
confinement: strict
platforms:
  amd64:
  arm64:

apps:
  ros2-snapd:
    command: ros2 run ros2_snapd ros2_snapd
    daemon: simple
    environment:
      ROS_HOME: $SNAP_DATA/ros
      FASTRTPS_DEFAULT_PROFILES_FILE: ${SNAP}/usr/share/fastdds_no_shared_memory.xml
    plugs: [network, network-bind, ros-snapd-support]
    extensions: [ros2-lyrical-ros-base]

parts:
  snapd-http:
    plugin: python
    python-packages: [snap-http]
    build-packages: [git, python3.14-venv]
    # core26 python plugin expects a venv-capable interpreter in the payload;
    # python3 itself is already staged via the colcon part (rclpy dependency chain).
    stage-packages: [python3.14-venv]
    source: .

  ros2-snapd:
    plugin: colcon
    source: .
    build-packages: [python3-lark]
    # stage ros2cli+ros2run: the app command is `ros2 run ros2_snapd ros2_snapd`,
    # which requires the ros2 binary and the `run` verb at runtime.
    stage-packages: [ros-lyrical-ros2cli, ros-lyrical-ros2run]

  config:
    plugin: dump
    source: snap/local/
    organize:
      'fastdds_no_shared_memory.xml': usr/share/
