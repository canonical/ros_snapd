name: snap
on:
  push:
    branches:
      - humble
  pull_request:
    branches:
      - humble
  workflow_dispatch:
  workflow_call:
   inputs:
      branch-name:
        required: false
        type: string
        default: ''

jobs:
  snap:
    uses: ubuntu-robotics/snap_workflows/.github/workflows/snap.yaml@main
    secrets:
      store-login: ${{ secrets.STORE_LOGIN }}
    with:
      branch-name: ${{ inputs.branch-name == '' && github.ref || inputs.branch-name }}
      snap-name: ros2-snapd
      publish: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      test-script: |
        #!/bin/bash

        check_existence() {
          local topic_or_node=$1
          local name=$2
          local timeout=$3
          local start_time=$(date +%s)

          while true; do
            ros2 $topic_or_node list | grep -q "/$name"
            if [ $? -eq 0 ]; then
              echo "$name is running."
              return 0
            fi

            local current_time=$(date +%s)
            local elapsed_time=$((current_time - start_time))

            if [ $elapsed_time -ge $timeout ]; then
              echo "Error $name is not running."
              exit 1
            fi
            sleep 1
          done
        }

        ## Install ROS 2 cli
        sudo snap install ros2-cli --channel=humble/beta

        ## check that services are available
        check_existence service /ros2_snapd/list 30
        check_existence service /ros2_snapd/start 30
        check_existence service /ros2_snapd/stop 30
        check_existence service /ros2_snapd/restart 30

        # Source the ws inside the snap to access the service types
        source /snap/ros2-snapd/current/opt/ros/snap/local_setup.bash

        ## @todo test all services
        ros2 service call /ros2_snapd/list ros2_snapd/srv/SnapdList | grep 'success=True\|ros2-snapd.ros2-snapd' >/dev/null

        sudo snap stop ros2-snapd
