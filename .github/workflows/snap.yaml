name: snap
on:
  push:
    branches:
      - noetic
  pull_request:
    branches:
      - noetic
  workflow_dispatch:
  workflow_call:
    inputs:
      git-ref:
        required: false
        type: string
        default: ${{ github.ref }}

jobs:
  snap:
    permissions:
      contents: read
      actions: write
    uses: canonical/robotics-actions-workflows/.github/workflows/snap.yaml@main
    secrets:
      snapstore-login: ${{ secrets.STORE_LOGIN }}
    with:
      git-ref: ${{ inputs.git-ref }}
      runs-on: '["ubuntu-latest", "ubuntu-24.04-arm" ]'
      snapcraft-channel: "8.x/stable"
      snapcraft-enable-experimental-extensions: true
      snap-track: noetic
      lxd-image: ubuntu:20.04
      snap-risk: candidate
      snap-test-script: |
        #!/bin/bash

        check_existence() {
          local topic_or_node="${1}"
          local name="${2}"
          local timeout="${3}"
          local start_time=$(date +%s)
          local error_code=0

          while true; do
            error_code=$(${topic_or_node} list | grep -q "${name}"; echo $?)
            if [ $error_code -eq 0 ]; then
              echo "${name} is running."
              return 0
            fi

            local current_time=$(date +%s)
            local elapsed_time=$((current_time - start_time))

            if [ ${elapsed_time} -ge ${timeout} ]; then
              echo "Error $name is not running."
              exit 1
            fi
            sleep 1
          done
        }

        ## Install ROS
        sudo sh -c 'echo "deb http://packages.ros.org/ros/ubuntu $(lsb_release -sc) main" > /etc/apt/sources.list.d/ros-latest.list'

        sudo apt install --yes curl
        curl -s https://raw.githubusercontent.com/ros/rosdistro/master/ros.asc | sudo apt-key add -
        sudo apt update
        sudo apt install --yes ros-noetic-ros-core

        set +u
        source /opt/ros/noetic/setup.sh
        set -u

        # Source the snap ws to access the service types
        source /snap/ros-snapd/current/opt/ros/noetic/setup.bash

        roscore &

        # Connect the interface
        sudo snap connect ros-snapd:ros-snapd-support
        sudo snap restart ros-snapd
        sleep 5

        ## check that services are available
        check_existence rosservice /ros_snapd/list 30
        check_existence rosservice /ros_snapd/start 30
        check_existence rosservice /ros_snapd/stop 30
        check_existence rosservice /ros_snapd/restart 30

        ## @todo test all services
        rosservice type /ros_snapd/list | grep 'ros_snapd_interfaces/SnapdList' >/dev/null
        rosservice call /ros_snapd/list | grep 'success: True' >/dev/null

        sudo snap stop ros-snapd
